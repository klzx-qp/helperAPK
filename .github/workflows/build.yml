name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    # 【Ключевой момент 1】Используем Ubuntu 22.04
    # В 24.04 нет libtinfo5, из-за чего сборка падает.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9 (for Buildozer itself)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 【Ключевой момент 2】Ставим libltdl-dev и libltdl7-dev
          # Это лечит ошибку LT_SYS_SYMBOL_USCORE при сборке libffi.
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libltdl-dev libltdl7-dev libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          # 【Ключевой момент 3】Правильное имя пакета — pyjnius
          pip install pyjnius

      - name: Clean previous build cache
        run: |
          # 【Ключевой момент 4】Удаляем старый кэш.
          # Без этого p4a может подхватить остатки старой сборки.
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK with Buildozer
        # -v для подробного лога — легче диагностировать, если что-то пойдёт не так
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
